name: CodeQL Analysis

on:
  pull_request:
    paths:
      - 'runfile-installer/UI/src/**'
  push:
    branches:
      - main
      - release/therock-*
    paths:
      - 'runfile-installer/UI/src/**'
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runfile-installer/tests/codeql-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
         persist-credentials: false
      - name: Perform CodeQL Analysis
        run: bash run-codeql-analysis.sh --config ./configs/rocm-ui.conf
